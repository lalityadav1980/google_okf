name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.17.0"

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check src tests scripts

      - name: Lint
        run: uv run --locked ruff check src tests scripts

      - name: Scan tracked source for secrets
        run: uv run --locked python scripts/check_secrets.py

      - name: Audit locked runtime dependencies
        run: uv run --locked python scripts/audit_runtime_dependencies.py

      - name: Type check
        run: uv run --locked mypy src

      - name: Test
        run: uv run --locked pytest

      - name: Check and test release-admission policy
        run: |
          opa fmt --fail --list policies
          opa check --strict policies
          opa test policies --fail-on-empty --verbose

      - name: Validate sample OKF bundle
        run: >-
          uv run --locked verity-kf validate examples/pilot-bundle
          --profile profiles/verity-kf-pilot.yaml
          --now 2026-08-21T00:00:00Z

      - name: Build and verify reproducible sample release
        run: |
          uv run --locked verity-kf build-release examples/pilot-bundle \
            --profile profiles/verity-kf-pilot.yaml \
            --bundle-id verity-kf-pilot \
            --release-id ci-sample \
            --source-commit 0000000000000000000000000000000000000000 \
            --created-at 2026-08-21T00:00:00Z \
            --output-dir dist/ci-release
          uv run --locked verity-kf verify-release dist/ci-release/ci-sample.tar.gz

      - name: Build framework distributions, SBOM, and digest evidence
        run: |
          uv build --no-build-isolation --no-create-gitignore --out-dir dist/framework
          uv run --locked python scripts/build_framework_evidence.py \
            --dist-dir dist/framework \
            --source-commit "${GITHUB_SHA}" \
            --created-at "$(git show -s --format=%cI HEAD)"
          uv run --locked python scripts/verify_framework_evidence.py \
            --dist-dir dist/framework \
            --expected-source-commit "${GITHUB_SHA}" \
            --expected-lock-file uv.lock
          uv run --locked python scripts/check_framework_reproducibility.py \
            --reference-dir dist/framework \
            --source-commit "${GITHUB_SHA}" \
            --created-at "$(git show -s --format=%cI HEAD)" \
            --lock-file uv.lock

      - name: Retain framework supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verity-knowledge-fabric-framework-${{ github.sha }}
          path: dist/framework/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
