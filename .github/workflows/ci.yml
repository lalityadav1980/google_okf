name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.17.0"

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Type check
        run: uv run --locked mypy src

      - name: Test
        run: uv run --locked pytest

      - name: Check and test release-admission policy
        run: |
          opa fmt --fail --list policies
          opa check --strict policies
          opa test policies --fail-on-empty --verbose

      - name: Validate sample OKF bundle
        run: >-
          uv run --locked xyz-okf validate examples/pilot-bundle
          --profile profiles/xyz-bank-pilot.yaml
          --now 2026-08-21T00:00:00Z

      - name: Build and verify reproducible sample release
        run: |
          uv run --locked xyz-okf build-release examples/pilot-bundle \
            --profile profiles/xyz-bank-pilot.yaml \
            --bundle-id xyz-bank-pilot \
            --release-id ci-sample \
            --source-commit 0000000000000000000000000000000000000000 \
            --created-at 2026-08-21T00:00:00Z \
            --output-dir dist/ci-release
          uv run --locked xyz-okf verify-release dist/ci-release/ci-sample.tar.gz
