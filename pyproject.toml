[project]
name = "verity-knowledge-fabric"
version = "0.2.0"
description = "Governed, versioned knowledge fabric for enterprise agents"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "markdown-it-py>=4.0,<5",
  "opentelemetry-api>=1.44,<2",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
  "rich>=15.0,<16",
  "typer>=0.20,<1",
]

[project.scripts]
verity-kf = "verity_kf.cli:app"

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "hatchling>=1.27,<2",
  "httpx2>=2,<3",
  "mypy>=2.3,<3",
  "opentelemetry-sdk>=1.44,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<1",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_kf"]

[tool.hatch.build.targets.wheel.force-include]
"policies/release_admission.rego" = "verity_kf/assets/policies/release_admission.rego"
"schemas" = "verity_kf/assets/schemas"

[tool.uv]
required-version = ">=0.11.7,<0.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=verity_kf --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["verity_kf"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["verity_kf"]
