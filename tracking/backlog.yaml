    name: Repository and architecture foundation
    status: BLOCKED
    exit_criteria:
      - Local quality gates pass.
      - Remote CI succeeds on the protected branch.
      - Repository license decision has a named owner.
  - id: M1
    name: Validator and producer SDK
    status: IN_REVIEW
    exit_criteria:
      - Conformance fixture pack passes.
      - Deterministic source-to-concept rendering is demonstrated.
      - Connector contract tests cover version, deletion, entitlement, and retry behavior.
  - id: M2
    name: Controlled source producers
    status: BLOCKED
    exit_criteria:
      - One Confluence and one SharePoint collection produce reviewable concepts.
      - Source versions, classifications, deletions, and entitlements are preserved.
  - id: M3
    name: Immutable release supply chain
    status: BLOCKED
    exit_criteria:
      - A validated bundle is packaged, signed, verified, promoted, and rolled back by digest.
  - id: M4
    name: Authorized consumer pilot
    status: BLOCKED
    exit_criteria:
      - One YODA or RACK consumer retrieves cited concepts from a named release.
      - Negative entitlement tests return no unauthorized content.
  - id: M5
    name: Assurance and production decision
    status: BLOCKED
    exit_criteria:
      - Quality, security, resilience, privacy, records, and operating evidence is approved.

